name: Update Contribution Snake
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate contribution snake
        uses: liamg/contribution-grid-snake-action@v1
        with:
          filename: output/github-contribution-grid-snake.svg
      - name: Commit generated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake.svg || true
          git commit -m "chore: update contribution snake" || echo "no changes"
          git push
